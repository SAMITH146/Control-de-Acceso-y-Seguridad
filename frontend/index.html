<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso | La Perla S.A.</title>
    <script>
        (function() {
            try {
                const u = JSON.parse(localStorage.getItem('usuario_activo'));
                if (u && u.id_usuario) {
                    if (u.id_rol === 1) {
                        window.location.replace('admin.html');
                    } else {
                        window.location.replace('porteria.html');
                    }
                }
            } catch(e) {}
        })();
    </script>
    <!-- Vinculamos tu archivo CSS separado -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Iconos gratuitos de Phosphor Icons para darle un toque moderno -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="login-container">
        <!-- Encabezado con Logo y Título -->
        <div class="login-header">
            <div class="logo-placeholder">
                <i class="ph ph-shield-check"></i>
            </div>
            <h1>LA PERLA S.A.</h1>
            <p>Control de Acceso y Seguridad</p>
        </div>
        
        <!-- Formulario -->
        <form class="login-form" action="#" method="POST">
            <!-- Input Usuario -->
            <div class="input-group">
                <i class="ph ph-user icon"></i>
                <input type="text" id="usuario" required placeholder="Usuario o Documento">
            </div>
            
            <!-- Input Contraseña -->
            <div class="input-group" style="position:relative;">
                <i class="ph ph-lock-key icon"></i>
                <input type="password" id="password" required placeholder="Contraseña" style="padding-right:40px;">
                <i class="ph ph-eye" id="togglePassword" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b;font-size:1.25rem;" title="Mostrar / Ocultar Contraseña"></i>
            </div>

            <!-- Opciones extra -->
            <div class="form-actions">
                <label class="checkbox-container" style="cursor:pointer;user-select:none;">
                    <input type="checkbox" id="recordar">
                    Recordar mi usuario
                </label>
                <a href="#" class="forgot-password" onclick="alert('Si ha olvidado su contraseña o presenta problemas de acceso, por favor comuníquese con el departamento de Sistemas de La Perla S.A.'); return false;">¿Problemas?</a>
            </div>

            <!-- Botón Ingresar -->
            <button type="submit" class="btn-ingresar">
                INGRESAR AL SISTEMA
                <i class="ph ph-arrow-right"></i>
            </button>
        </form>
        
        <!-- Pie de página de la tarjeta -->
        <div class="login-footer">
            <p>&copy; 2026 La Perla S.A. | Módulo de Portería</p>
        </div>
    </div>

    <!-- ==================== MODAL OBLIGATORIO: PRIMER CAMBIO DE CONTRASEÑA ==================== -->
    <div class="modal-overlay hidden" id="modalPrimerPassword" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.85);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:9999;">
        <div class="modal-card" style="background:#fff;border-radius:12px;width:90%;max-width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);overflow:hidden;">
            <div style="background:linear-gradient(135deg, #0E773A, #0a582b);color:#fff;padding:20px;text-align:center;">
                <i class="ph ph-lock-key" style="font-size:2.5rem;margin-bottom:8px;display:block;"></i>
                <h3 style="margin:0;font-size:1.25rem;">🔐 Primer Inicio de Sesión</h3>
                <p style="margin:4px 0 0 0;font-size:0.85rem;opacity:0.9;">Por seguridad, debes personalizar tu contraseña personal antes de continuar.</p>
            </div>
            <form id="formPrimerPassword" onsubmit="guardarPrimerPassword(event)" style="padding:24px;">
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-weight:700;color:#1e293b;margin-bottom:6px;font-size:0.9rem;">Nueva Contraseña <span style="color:#dc2626;">*</span></label>
                    <div style="position:relative;">
                        <input type="password" id="primerNuevaPassword" placeholder="Mínimo 6 caracteres" required style="width:100%;padding:10px 40px 10px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:0.95rem;box-sizing:border-box;">
                        <i class="ph ph-eye" id="togglePrimerPass1" onclick="toggleVisibilidadInput('primerNuevaPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b;font-size:1.2rem;"></i>
                    </div>
                </div>

                <div style="margin-bottom:20px;">
                    <label style="display:block;font-weight:700;color:#1e293b;margin-bottom:6px;font-size:0.9rem;">Confirmar Nueva Contraseña <span style="color:#dc2626;">*</span></label>
                    <div style="position:relative;">
                        <input type="password" id="primerConfirmarPassword" placeholder="Vuelve a escribir la nueva contraseña" required style="width:100%;padding:10px 40px 10px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:0.95rem;box-sizing:border-box;">
                        <i class="ph ph-eye" id="togglePrimerPass2" onclick="toggleVisibilidadInput('primerConfirmarPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b;font-size:1.2rem;"></i>
                    </div>
                </div>

                <button type="submit" id="btnGuardarPrimerPass" style="width:100%;background:#0E773A;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:700;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 6px -1px rgba(14,119,58,0.3);">
                    GUARDAR Y CONTINUAR <i class="ph ph-arrow-right-bold"></i>
                </button>
            </form>
        </div>
    </div>
    
    <!-- Lógica Potente en JavaScript -->
    <script src="js/login.js"></script>
</body>
</html>
